<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Cricket Stream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: linear-gradient(135deg, #1a2238 0%, #283655 100%);
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
        }
        .main-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 0 80px 0;
        }
        .match-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 32px;
            margin-bottom: 32px;
        }
        .team-logo {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: #fff2; display: flex; align-items: center; justify-content: center;
            font-size: 2.2em; font-weight: bold; color: #ffd700;
            box-shadow: 0 2px 8px #0003;
        }
        .vs {
            font-size: 2.2em;
            font-weight: bold;
            color: #ffd700;
            margin: 0 16px;
        }
        .scoreboard-card {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 32px;
            margin-bottom: 32px;
        }
        .team-block {
            background: linear-gradient(135deg, #232a36 60%, #1a73e8 100%);
            border-radius: 18px;
            box-shadow: 0 4px 16px #0004;
            padding: 32px 28px 24px 28px;
            min-width: 340px;
            flex: 1 1 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .on-pitch {
            display: flex;
            gap: 18px;
            margin: 18px 0 0 0;
            width: 100%;
            justify-content: center;
        }
        .batsman-card, .bowler-card {
            background: #20232b;
            border-radius: 12px;
            box-shadow: 0 2px 8px #0003;
            padding: 14px 18px;
            min-width: 120px;
            text-align: center;
            flex: 1 1 0;
        }
        .batsman-name, .bowler-name {
            font-weight: bold;
            font-size: 1.1em;
            color: #ffd700;
            margin-bottom: 4px;
        }
        .batsman-stats, .bowler-stats {
            font-size: 1em;
            color: #fff;
        }
        .bowler-card {
            background: #1a73e8;
            color: #fff;
            margin-top: 18px;
        }
        .team-name {
            font-size: 1.3em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
            color: #ffd700;
            letter-spacing: 1px;
        }
        .team-score {
            font-size: 3em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 18px;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 2px 8px #0008;
        }
        .section-title {
            font-size: 1.1em;
            color: #ffd700;
            margin: 18px 0 6px 0;
            text-align: left;
            width: 100%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
            background: #232a36cc;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 7px 8px;
            text-align: left;
        }
        th {
            background: #1a73e8;
            color: #fff;
            font-weight: 600;
        }
        tr:nth-child(even) { background: #232a36; }
        tr:nth-child(odd) { background: #20232b; }
        .ticker-container {
            width: 100vw;
            background: linear-gradient(90deg, #1a73e8 60%, #ffd700 100%);
            overflow: hidden;
            position: fixed;
            bottom: 0; left: 0; z-index: 100;
        }
        .ticker {
            white-space: nowrap;
            display: inline-block;
            padding: 12px 0;
            font-size: 1.25em;
            color: #fff;
            animation: ticker 30s linear infinite;
            font-weight: 500;
            letter-spacing: 1px;
        }
        @keyframes ticker {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100vw); }
        }
        .update-time {
            text-align: right;
            color: #aaa;
            font-size: 0.95em;
            margin: 10px 0 0 0;
        }
        @media (max-width: 900px) {
            .scoreboard-card { flex-direction: column; align-items: center; gap: 24px; }
            .team-block { min-width: 90vw; }
            .match-header { flex-direction: column; gap: 12px; }
        }
    </style>
</head>
<body>
<div class="main-container">
    <div class="match-header" id="match-header"></div>
    <div class="scoreboard-card" id="scoreboard"></div>
    <div class="update-time" id="update-time"></div>
</div>
<div class="ticker-container"><div class="ticker" id="ticker"></div></div>
<script>
const SCORE_JSON = 'resource/score/parsed_scorecard.json';

function getTeamInitial(teamName) {
    // Try to extract initials from team name, e.g., "United Arab Emirates Innings" => "UAE"
    if (!teamName) return '';
    const words = teamName.replace('Innings', '').trim().split(' ');
    if (words.length === 1) return words[0].slice(0, 3).toUpperCase();
    return words.map(w => w[0]).join('').toUpperCase();
}

function renderMatchHeader(data) {
    if (!data.innings || data.innings.length < 2) {
        document.getElementById('match-header').innerHTML = '';
        return;
    }
    const t1 = data.innings[0].team;
    const t2 = data.innings[1].team;
    const t1init = getTeamInitial(t1);
    const t2init = getTeamInitial(t2);
    // If you have team logos, replace the initials with <img src=...>
    document.getElementById('match-header').innerHTML = `
        <div class="team-logo">${t1init}</div>
        <div class="vs">VS</div>
        <div class="team-logo">${t2init}</div>
    `;
}


function renderTeamBlock(inn) {
    let html = `<div class='team-block'>`;
    html += `<div class='team-name'>${inn.team}</div>`;
    html += `<div class='team-score'>${inn.score}</div>`;
    // On-pitch batsmen (assume first two not out or last two with 'not out' in dismissal)
    let batsmen = (inn.batsmen || []);
    let onPitch = batsmen.filter(b => (b.dismissal && b.dismissal.toLowerCase().includes('not out')));
    if (onPitch.length < 2 && batsmen.length >= 2) {
        // fallback: just take last two
        onPitch = batsmen.slice(-2);
    }
    html += `<div class='on-pitch'>`;
    onPitch.slice(0,2).forEach(b => {
        html += `<div class='batsman-card'>`;
        html += `<div class='batsman-name'>${b.name}</div>`;
        html += `<div class='batsman-stats'>${b.runs} (${b.balls})<br>4s: ${b.fours} | 6s: ${b.sixes}<br>SR: ${b.sr}</div>`;
        html += `</div>`;
    });
    html += `</div>`;
    // Current bowler (assume first bowler in list)
    if (inn.bowlers && inn.bowlers.length) {
        let bw = inn.bowlers[0];
        html += `<div class='bowler-card'>`;
        html += `<div class='bowler-name'>${bw.name}</div>`;
        html += `<div class='bowler-stats'>O: ${bw.overs} | R: ${bw.runs} | W: ${bw.wickets}<br>Eco: ${bw.eco} | M: ${bw.maidens} | NB: ${bw.nb} | WD: ${bw.wd}</div>`;
        html += `</div>`;
    }
    html += `</div>`;
    return html;
}

function renderScoreboard(data) {
    let html = '';
    if (!data.innings || data.innings.length === 0) {
        html = '<p>No score data available.</p>';
        document.getElementById('scoreboard').innerHTML = html;
        return;
    }
    // Show both teams side by side
    html = data.innings.map(renderTeamBlock).join('');
    document.getElementById('scoreboard').innerHTML = html;
}

function getBallTicker(data) {
    // Try to extract ball-by-ball from fall_of_wickets or similar
    let balls = [];
    if (data.innings && data.innings.length) {
        data.innings.forEach(inn => {
            if (inn.fall_of_wickets && inn.fall_of_wickets.length) {
                balls = balls.concat(inn.fall_of_wickets.map(fow => fow.split(' ')[0]));
            }
        });
    }
    if (balls.length === 0) balls = ['No ball-by-ball data'];
    return balls.join(' | ');
}

async function fetchAndUpdate() {
    try {
        const resp = await fetch(SCORE_JSON + '?_=' + Date.now());
        if (!resp.ok) throw new Error('Failed to fetch score JSON');
        const data = await resp.json();
        renderMatchHeader(data);
        renderScoreboard(data);
        document.getElementById('update-time').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
        document.getElementById('ticker').textContent = getBallTicker(data);
    } catch (e) {
        document.getElementById('scoreboard').innerHTML = '<p style="color:red;">Could not load score data.</p>';
        document.getElementById('ticker').textContent = '';
        document.getElementById('match-header').innerHTML = '';
    }
}

fetchAndUpdate();
setInterval(fetchAndUpdate, 10000); // update every 10 seconds
</script>
</body>
</html>
