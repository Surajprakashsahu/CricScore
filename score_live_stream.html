<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Cricket Stream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #181c24; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; }
        .main-container { max-width: 1100px; margin: 0 auto; padding: 24px 0; }
        .scoreboard { display: flex; justify-content: center; align-items: flex-start; gap: 40px; margin-bottom: 32px; }
        .team-block { background: #232a36; border-radius: 12px; box-shadow: 0 2px 8px #0003; padding: 24px 32px; min-width: 350px; }
        .team-name { font-size: 1.5em; font-weight: bold; text-align: center; margin-bottom: 8px; color: #1a73e8; }
        .team-score { font-size: 2.5em; font-weight: bold; text-align: center; margin-bottom: 12px; letter-spacing: 2px; }
        .section-title { font-size: 1.1em; color: #ffd700; margin: 18px 0 6px 0; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
        th, td { padding: 6px 8px; text-align: left; }
        th { background: #1a73e8; color: #fff; font-weight: 600; }
        tr:nth-child(even) { background: #232a36; }
        tr:nth-child(odd) { background: #20232b; }
        .ticker-container { width: 100vw; background: #1a73e8; overflow: hidden; position: fixed; bottom: 0; left: 0; z-index: 100; }
        .ticker { white-space: nowrap; display: inline-block; padding: 10px 0; font-size: 1.2em; color: #fff; animation: ticker 30s linear infinite; }
        @keyframes ticker {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100vw); }
        }
        .update-time { text-align: right; color: #aaa; font-size: 0.95em; margin: 10px 0 0 0; }
        @media (max-width: 900px) {
            .scoreboard { flex-direction: column; align-items: center; gap: 24px; }
            .team-block { min-width: 90vw; }
        }
    </style>
</head>
<body>
<div class="main-container">
    <div class="scoreboard" id="scoreboard"></div>
    <div class="update-time" id="update-time"></div>
</div>
<div class="ticker-container"><div class="ticker" id="ticker"></div></div>
<script>
const SCORE_JSON = 'resource/score/parsed_scorecard.json';

function renderTeamBlock(inn) {
    let html = `<div class='team-block'>`;
    html += `<div class='team-name'>${inn.team}</div>`;
    html += `<div class='team-score'>${inn.score}</div>`;
    // Batsmen
    html += `<div class='section-title'>Batsmen</div>`;
    html += `<table><tr><th>Name</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th><th>Dismissal</th></tr>`;
    (inn.batsmen || []).forEach(b => {
        html += `<tr><td>${b.name}</td><td>${b.runs}</td><td>${b.balls}</td><td>${b.fours}</td><td>${b.sixes}</td><td>${b.sr}</td><td>${b.dismissal}</td></tr>`;
    });
    html += `</table>`;
    // Bowlers
    if (inn.bowlers && inn.bowlers.length) {
        html += `<div class='section-title'>Bowlers</div>`;
        html += `<table><tr><th>Name</th><th>O</th><th>M</th><th>R</th><th>W</th><th>NB</th><th>WD</th><th>ECO</th></tr>`;
        inn.bowlers.forEach(bw => {
            html += `<tr><td>${bw.name}</td><td>${bw.overs}</td><td>${bw.maidens}</td><td>${bw.runs}</td><td>${bw.wickets}</td><td>${bw.nb}</td><td>${bw.wd}</td><td>${bw.eco}</td></tr>`;
        });
        html += `</table>`;
    }
    html += `</div>`;
    return html;
}

function renderScoreboard(data) {
    let html = '';
    if (!data.innings || data.innings.length === 0) {
        html = '<p>No score data available.</p>';
        document.getElementById('scoreboard').innerHTML = html;
        return;
    }
    // Show both teams side by side
    html = data.innings.map(renderTeamBlock).join('');
    document.getElementById('scoreboard').innerHTML = html;
}

function getBallTicker(data) {
    // Try to extract ball-by-ball from fall_of_wickets or similar
    let balls = [];
    if (data.innings && data.innings.length) {
        data.innings.forEach(inn => {
            if (inn.fall_of_wickets && inn.fall_of_wickets.length) {
                balls = balls.concat(inn.fall_of_wickets.map(fow => fow.split(' ')[0]));
            }
        });
    }
    if (balls.length === 0) balls = ['No ball-by-ball data'];
    return balls.join(' | ');
}

async function fetchAndUpdate() {
    try {
        const resp = await fetch(SCORE_JSON + '?_=' + Date.now());
        if (!resp.ok) throw new Error('Failed to fetch score JSON');
        const data = await resp.json();
        renderScoreboard(data);
        document.getElementById('update-time').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
        document.getElementById('ticker').textContent = getBallTicker(data);
    } catch (e) {
        document.getElementById('scoreboard').innerHTML = '<p style="color:red;">Could not load score data.</p>';
        document.getElementById('ticker').textContent = '';
    }
}

fetchAndUpdate();
setInterval(fetchAndUpdate, 10000); // update every 10 seconds
</script>
</body>
</html>
